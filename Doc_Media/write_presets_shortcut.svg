<svg xmlns="http://www.w3.org/2000/svg" width="370" height="70" viewBox="0 0 370 70" role="img" aria-label="Write Presets shortcuts">
  <text x="0" y="18" fill="#8a8a8a" font-size="16" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">Shortcuts:</text>
  <text x="0" y="42" fill="#8a8a8a" font-size="16" font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <tspan font-weight="700" font-style="italic">Shift + W</tspan>
    <tspan> [open Write Presets]</tspan>
  </text>
  <text x="0" y="66" fill="#8a8a8a" font-size="16" font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <tspan font-weight="700" font-style="italic">Alt + Shift + W</tspan>
    <tspan> [save selection as preset]</tspan>
  </text>
</svg>
