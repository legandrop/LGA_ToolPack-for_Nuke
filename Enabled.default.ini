; LGA ToolPack - Valores de fabrica de cada herramienta.
;
; ESTE ARCHIVO NO ES TU CONFIGURACION: son los valores con los que arranca
; el pack. Editarlo funciona, pero viaja adentro del pack y el instalador
; lo reemplaza en cada update, asi que la edicion se pierde ahi.
;
; Para activar o desactivar herramientas: menu TP > Enable Tools.
; Eso guarda tu eleccion fuera del pack y ningun update la toca.

[Tools]
; === READ n WRITE ===
Media_Manager = True
Media_Path_Replacer = True
Paths_To_Relative = True
Read_From_Write = True
Open_in_Shot_Player = True
Duplicate_Publish = True
Write_Presets = True
Write_Focus = True
Write_Add_Send_Mail = True
Show_in_Explorer = True
Show_in_Flow = True
Show_Flow_Notes = True
Color_Space_Favs = True

; === FRAME RANGE ===
FR_Read_to_Project = True
FR_Read_to_Project_Res = True

; === ROTATE TRANSFORM ===
Rotate_Commands = True

; === NODE BUILDS ===
Build_Iteration = True
Build_Roto_BlurMask = True
Build_Merge_SwitchOps = True
Build_Grade = True
Build_Grade_Highlights = True

; === KNOBS ===
Disable_A_B = True
Channels_Cycle = True
Channel_HotBox = True

; === VA ===
Viewer_Rec709 = True
Snapshot_Tools = True
Reset_Workspace = True
Restart_NukeX = True

; `Settings` y `Enable Tools` no figuran aca a proposito: son los dos accesos
; a la configuracion del pack y tienen que existir siempre.
